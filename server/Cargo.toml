[package]
name = "qurai-server"
version = "1.0.0"
edition = "2021"
description = "QURAi server: sinxronizatsiya, kirish nazorati va mobil ko'rinish"

[dependencies]
argon2 = "0.5"
axum = "0.8"
chrono = "0.4"
rand = "0.8"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
qurai-hash = { path = "../hash" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
