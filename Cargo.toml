# Ish maydoni: desktop ilova va server bitta omborda, lekin alohida
# yig'iladi. Desktop ilovaga server kutubxonalari kirmaydi.
[workspace]
members = [".", "server"]

[package]
name = "qurai"
version = "1.0.0"
edition = "2021"
description = "Construction Intelligence Platform — native desktop client"

[dependencies]
eframe = "0.31"
egui = "0.31"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
directories = "6"
rfd = "0.15"
calamine = "0.36.1"
# egui bilan bir xil versiya bo'lishi shart.
egui_extras = { version = "0.31", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# Faqat `llm` xususiyati bilan yig'iladi.
ureq = { version = "2", optional = true, default-features = false, features = ["tls"] }
# Excel yozish: KS-2, KS-3, M-29 va jadval eksporti uchun.
rust_xlsxwriter = { version = "0.99.0", default-features = false }
printpdf = { version = "0.7", default-features = false }
lopdf = { version = "0.31", default-features = false, features = ["chrono_time", "pom_parser"] }

[features]
# OpenAI integratsiyasi yig'ilishga kiradi, lekin **ishlamaydi**: u sozlamada
# yoqilib, kalit kiritilmaguncha ilova hech qayerga ulanmaydi. Tarmoq
# kutubxonasi umuman kerak bo'lmasa — `--no-default-features` bilan yig'ing,
# shunda `llm` kodi kompilyatsiyaga ham kirmaydi.
default = ["llm", "sync"]
llm = ["dep:ureq"]
# Server bilan sinxronizatsiya. Sukut bo'yicha yig'ilishga kiradi, lekin
# sozlamada manzil kiritilib, kirish qilinmaguncha ishlamaydi.
sync = ["dep:ureq"]

[profile.release]
opt-level = 3
lto = true
strip = true
